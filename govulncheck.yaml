  - id: GO-2026-4340
    cve: N/A
    package: crypto/tls
    title: Handshake messages may be processed at the incorrect encryption level
    severity: High
    fixed_in: crypto/tls@go1.25.6
    reason: |
      Standard library vulnerability in crypto/tls affecting Go 1.25.5. Fixed in Go 1.25.6.
      This affects TLS handshake processing. Our code uses http.Client which calls tls.Conn.HandshakeContext
      indirectly through HTTP requests. The vulnerability is in the standard library and will be fixed
      when we upgrade to Go 1.25.6+. Currently documenting as accepted risk until Go 1.25.6 is available.
      Impact: Handshake messages may be processed at incorrect encryption level, potentially leading
      to connection issues or security concerns in TLS connections.
    review_date: "2026-01-30"
    next_review: "2026-02-28"
    status: symbol-level

  - id: GO-2026-4341
    cve: N/A
    package: net/url
    title: Memory exhaustion in query parameter parsing
    severity: High
    fixed_in: net/url@go1.25.6
    reason: |
      Standard library vulnerability in net/url affecting Go 1.25.5. Fixed in Go 1.25.6.
      This affects URL query parameter parsing and could lead to memory exhaustion with malicious URLs.
      Our code uses net/url indirectly through HTTP client operations. The vulnerability is in the
      standard library and will be fixed when we upgrade to Go 1.25.6+. Currently documenting as
      accepted risk until Go 1.25.6 is available.
      Impact: Malicious URLs with crafted query parameters could cause memory exhaustion.
    review_date: "2026-01-30"
    next_review: "2026-02-28"
    status: package-level

  - id: GO-2026-4342
    cve: N/A
    package: archive/zip
    title: Excessive CPU consumption when building archive index
    severity: Medium
    fixed_in: archive/zip@go1.25.6
    reason: |
      Standard library vulnerability in archive/zip affecting Go 1.25.5. Fixed in Go 1.25.6.
      This affects ZIP archive processing and could lead to excessive CPU consumption with malicious
      ZIP files. Our code doesn't directly use archive/zip, but it's part of the standard library.
      The vulnerability will be fixed when we upgrade to Go 1.25.6+. Currently documenting as
      accepted risk until Go 1.25.6 is available.
      Impact: Malicious ZIP files could cause excessive CPU consumption during archive processing.
    review_date: "2026-01-30"
    next_review: "2026-02-28"
    status: module-level
