# unified CI + Integration
name: optimum-common CI

env:
  go-version: "1.24.4"
  vuln-version: "v1.1.4"
#  lint-version: "v1.64.7"
  GOPRIVATE: "github.com/getoptimum"
  GITHUB_TOKEN: ${{ secrets.OPT_ACCESS_TOKEN }}

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # release tags like v1.2.3
  pull_request:
    branches: [ '**' ]  # run on PRs to any branch

permissions:
  contents: read
  pull-requests: read
  checks: write  # allow linter to annotate diffs

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ secrets.OPT_ACCESS_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # match your local CLI
          version: v2.4.0
          args: --timeout 7m
          only-new-issues: true
          working-directory: ./


  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ secrets.OPT_ACCESS_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: Run tests
        run: CI_RUN="true" make test

      - name: Measure test coverage
        run: make coverage

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Run on PRs and on version tags; skip for normal non-tag pushes to branches
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: |
          git config --global url."https://${{ secrets.OPT_ACCESS_TOKEN }}:@github.com/".insteadOf "https://github.com/"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.vuln-version }}

      - name: Run govulncheck
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          make vulcheck
