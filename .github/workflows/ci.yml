# runs on pushes/PRs to main for fast feedback
name: optimum-common CI

env:
  # synced with other repos
  go-version: "1.24.4"
  lint-version: "v1.64.7"
  GOPRIVATE: "github.com/getoptimum"
  GITHUB_TOKEN: ${{ secrets.OPT_ACCESS_TOKEN }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read
  checks: write # so linters can decorate diffs

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - uses: actions/checkout@v4
      - name: Configure git for private modules
        # configure git to fetch private modules with PAT:
        run: git config --global url."https://${{ secrets.OPT_ACCESS_TOKEN }}:@github.com/".insteadOf "https://github.com/"
      - name: Run tests
        run: CI_RUN="true" make test
      - name: Measure test coverage
        run: make coverage

  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - uses: actions/checkout@v4
      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.OPT_ACCESS_TOKEN }}:@github.com/".insteadOf "https://github.com/"
      - name: golangci-lint
        # your repos use v6/v7/v8 of the action; pick one and keep it org-wide (v7 here)
        uses: golangci/golangci-lint-action@v7
        with:
          # version: ${{ env.lint-version }}
          # Keep go-version and other vars in env -> that’s fine.
          # For golangci-lint version, always hardcode v1.64.7 (or latest) in the job.
          # version: v1.64.7
          version: v2.4.0
          args: --timeout 7m
          only-new-issues: true # linter will report only problems introduced by the PR
          working-directory: ./
