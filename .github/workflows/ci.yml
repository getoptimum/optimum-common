name: optimum-common CI

env:
  go-version: "1.25.6"
  vuln-version: "v1.1.4"
  GOPRIVATE: "github.com/getoptimum"

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # release tags like v1.2.3
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: getoptimum

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # match your local CLI
          version: v2.4.0
          args: --timeout 7m
          only-new-issues: true
          working-directory: ./

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: getoptimum

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Run tests
        run:  make test

      - name: Measure and enforce test coverage
        run: make coverage

      - name: Check documentation is up-to-date
        run: make docs-check

  fuzz:
    name: fuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: getoptimum

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Run fuzz tests
        run: make fuzz FUZZ_TIME=10s

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Run on PRs and on version tags; skip for normal non-tag pushes to branches
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: getoptimum

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.vuln-version }}

      - name: Run dependency vulnerability scan with filtering
        run: |
          # Read accepted vulnerability exceptions from govulncheck.yaml
          IGNORED_VULNS=$(awk '/- id:/ {print $3}' govulncheck.yaml | paste -sd '|' -)

          if [ -z "$IGNORED_VULNS" ]; then
            echo "No ignored vulnerabilities configured in govulncheck.yaml"
            IGNORED_VULNS="^$"  # Match nothing
          else
            echo "Ignored vulnerabilities from govulncheck.yaml: $IGNORED_VULNS"
          fi

          echo "Running govulncheck..."
          set +e  # Don't exit on error, we want to process the results
          govulncheck -show verbose ./... 2>&1 | tee /tmp/govulncheck-output.txt
          govulncheck_exit=$?
          set -e

          # Extract vulnerability IDs and check if only ignored ones were found
          found_vulns=$(grep -o 'GO-[0-9]\{4\}-[0-9]\+' /tmp/govulncheck-output.txt | sort -u || true)

          echo "Found vulnerabilities: $found_vulns"
          echo "Govulncheck exit code: $govulncheck_exit"

          # Check if govulncheck crashed (non-zero exit but no vulnerabilities found)
          if [ $govulncheck_exit -ne 0 ] && [ -z "$found_vulns" ]; then
            echo "❌ govulncheck failed with exit code $govulncheck_exit (no vulnerabilities detected in output)"
            exit $govulncheck_exit
          fi

          if [ -z "$found_vulns" ]; then
            echo "✅ No vulnerabilities found"
            exit 0
          fi

          # Filter out ignored vulnerabilities
          non_ignored=$(echo "$found_vulns" | grep -Ev "$IGNORED_VULNS" || true)
          echo "Non-ignored vulnerabilities: $non_ignored"

          if [ -z "$non_ignored" ]; then
            echo "✅ Only accepted vulnerabilities found: $found_vulns"
            echo "   (Documented in govulncheck.yaml as accepted risks)"
            exit 0
          else
            echo "❌ Found non-accepted vulnerabilities: $non_ignored"
            echo "   Please fix or document these in govulncheck.yaml"
            exit 1
          fi

  release:
    name: goreleaser
    needs: [lint, tests, vulncheck]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: getoptimum
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5742e2a039330cbb23ebf35f046f814d4c6ff811 # v5.1.0
        with:
          version: v2.12.0        # optional pin
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
