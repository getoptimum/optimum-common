name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - v*

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}-lint
  cancel-in-progress: true

jobs:
  golangci:
    uses: getoptimum/.github/.github/workflows/go-lint.yml@398f1436255c41d176b673c771dce8d52e657ca5 # getoptimum/.github#7
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Run on PRs and on version tags; skip for normal non-tag pushes to branches
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # govulncheck is pinned via go.mod's tool block, so CI and `make vulcheck`
      # run the same binary. It fails only when a vulnerable symbol is reachable;
      # advisories in required-but-uncalled modules are informational.
      - name: Run govulncheck
        run: go tool govulncheck ./...
