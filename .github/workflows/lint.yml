name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - v*

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}-lint
  cancel-in-progress: true

jobs:
  golangci:
    uses: getoptimum/.github/.github/workflows/go-lint.yml@398f1436255c41d176b673c771dce8d52e657ca5 # getoptimum/.github#7
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Run on PRs and on version tags; skip for normal non-tag pushes to branches
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      # Official govulncheck action. It fails only when your code is actually
      # affected (a vulnerable symbol is reachable); advisories in required but
      # uncalled modules are reported as informational and do not block.
      - name: Run govulncheck
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee # v1.0.4
        with:
          go-version-file: go.mod
          go-package: ./...
