name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.*" # Push events to matching vX.Y.Z*, e.g. v0.0.1-rc1, v1.0.3

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}-release
  cancel-in-progress: true

env:
  go-version: "1.25.7"
  GOPRIVATE: "github.com/getoptimum"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Generate token from GitHub App
        id: generate-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: getoptimum

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://x-access-token:${{ steps.generate-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@5742e2a039330cbb23ebf35f046f814d4c6ff811 # v5.1.0
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          version: v2.12.0 # optional pin
          args: release --clean
