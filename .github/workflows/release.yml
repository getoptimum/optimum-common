name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.*" # Push events to matching vX.Y.Z*, e.g. v0.0.1-rc1, v1.0.3

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}-release
  cancel-in-progress: true

env:
  go-version: "1.27.2"

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v2.12.0 # optional pin
          args: release --clean
