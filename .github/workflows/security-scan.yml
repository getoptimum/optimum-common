name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  security-events: write

env:
  go-version: "1.27.2"

jobs:
  secrets-scan:
    name: Secrets Scanning (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for TruffleHog
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2
        with:
          extra_args: --only-verified

  code-security-scan:
    name: Code Security Scanning (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Run gosec security scanner
        run: |
          # Read exclusions from gosec.yaml and trim whitespace
          EXCLUDED_RULES=$(grep '^\s*- rule:' gosec.yaml | sed 's/.*rule:\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '\n' ',' | sed 's/,$//')

          if [ -z "$EXCLUDED_RULES" ]; then
            echo "No excluded rules configured in gosec.yaml"
            echo "Running go tool gosec -exclude-generated -exclude-dir=scripts -severity high ./..."
            go tool gosec -exclude-generated -exclude-dir=scripts -severity high ./...
          else
            echo "Running gosec with exclusions: $EXCLUDED_RULES"
            go tool gosec -exclude-generated -exclude=$EXCLUDED_RULES -exclude-dir=scripts -severity high ./...
          fi
