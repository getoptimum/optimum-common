name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write
  security-events: write

env:
  go-version: "1.26.5"

jobs:
  secrets-scan:
    name: Secrets Scanning (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for TruffleHog
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          extra_args: --only-verified

  code-security-scan:
    name: Code Security Scanning (gosec)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - name: Download Go dependencies
        run: go mod download
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@424fc4cd9c82ea0fd6bee9cd49c2db2c3cc0c93f
      - name: Run gosec security scanner
        run: |
          # Read exclusions from gosec.yaml and trim whitespace
          EXCLUDED_RULES=$(grep '^\s*- rule:' gosec.yaml | sed 's/.*rule:\s*//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '\n' ',' | sed 's/,$//')

          if [ -z "$EXCLUDED_RULES" ]; then
            echo "No excluded rules configured in gosec.yaml"
            echo "Running gosec -exclude-generated -exclude-dir=scripts -severity high ./..."
            gosec -exclude-generated -exclude-dir=scripts -severity high ./...
          else
            echo "Running gosec with exclusions: $EXCLUDED_RULES"
            gosec -exclude-generated -exclude=$EXCLUDED_RULES -exclude-dir=scripts -severity high ./...
          fi
