name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - v*

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}-test
  cancel-in-progress: true

env:
  go-version: "1.27.3"

jobs:
  unit-tests:
    name: unit tests
    # Fork PRs get no secrets, so they can't mint the token for private modules.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: getoptimum
          # Least privilege: read-only, scoped to the private modules this repo needs.
          repositories: shm
          permission-contents: read

      - name: Setup Go (private modules)
        uses: ./.github/actions/setup-go-private
        with:
          go-version: ${{ env.go-version }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Run tests and measure coverage
        run:  make test

  fuzz-tests:
    name: fuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Run fuzz tests
        run: FUZZ_TIME=10s make fuzz

  sde-kernel-tests:
    name: GF(256) kernels on emulated CPUs
    # Hosted runners may lack GFNI and AVX-512, and are amd64 only, so those
    # kernels and NEON would never run. Intel SDE emulates a Sapphire Rapids CPU,
    # which supports every amd64 kernel, and QEMU runs the arm64 build.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
      SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Install Intel SDE
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sde.tar.xz" "$SDE_URL"
          echo "$SDE_SHA256  $RUNNER_TEMP/sde.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1

      - name: Build rlnc tests
        run: go test -c -o "$RUNNER_TEMP/rlnc.test" ./pkg/rlnc/

      - name: Run rlnc tests on an emulated Sapphire Rapids CPU
        env:
          # Fails the job if detection misses a kernel, instead of skipping it.
          RLNC_REQUIRE_KERNELS: gfni-avx512,gfni,avx2,generic
        working-directory: pkg/rlnc
        run: |
          "$RUNNER_TEMP/sde/sde64" -spr -- "$RUNNER_TEMP/rlnc.test" -test.v -test.count=1

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Build pkg/rlnc tests for arm64
        run: GOARCH=arm64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/rlnc-arm64.test" ./pkg/rlnc/

      - name: Run pkg/rlnc tests on an emulated arm64 CPU
        env:
          RLNC_REQUIRE_KERNELS: neon,generic
        working-directory: pkg/rlnc
        run: |
          qemu-aarch64 "$RUNNER_TEMP/rlnc-arm64.test" -test.v -test.count=1
