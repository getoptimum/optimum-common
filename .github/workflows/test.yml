name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - v*

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}-test
  cancel-in-progress: true

env:
  go-version: "1.26.5"

jobs:
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Run tests and measure coverage
        run:  make test

  fuzz-tests:
    name: fuzz tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.go-version }}
          cache: true

      - name: Run fuzz tests
        run: FUZZ_TIME=10s make fuzz
